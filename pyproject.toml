[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ctx"
version = "0.1.0"
description = "A persistent, local context layer for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AlgoSmiths" }]
keywords = ["ai", "coding-agent", "code-index", "mcp", "context"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pathspec>=0.12",
    "jsonschema>=4",
    "mcp>=1.2",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# JavaScript, TypeScript, Go, and Java via tree-sitter grammars.
treesitter = [
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-java>=0.23",
]
# Optional local embeddings for `prism search --semantic` (the model must already be on disk).
semantic = ["sentence-transformers>=2.2", "numpy>=1.24"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
prism = "prism.cli:main"

[project.urls]
Homepage = "https://github.com/algosmiths/prism"

[tool.setuptools.packages.find]
include = ["prism*"]

[tool.setuptools.package-data]
prism = ["schemas/*.json", "templates/**/*", "viewer_dist/**/*", "py.typed"]

[tool.prism]
# Fixture repos are test data, not part of PRISM itself.
ignore = ["tests/fixtures/", "tests/golden/"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# E501: the formatter owns line length; long prose/SQL strings are left intact.
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.mypy]
strict = true
# Checked against the interpreter it runs on (CI covers 3.10-3.14), so the
# `tomllib` / `tomli` branches are each checked where they actually apply.
packages = ["prism"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "tree_sitter", "tree_sitter_javascript", "tree_sitter_typescript", "tree_sitter_go", "tree_sitter_java", "sentence_transformers", "numpy"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/golden"]
addopts = "-q"
